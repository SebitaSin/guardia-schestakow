# Servidor propio con Docker: la app + un proxy que pone HTTPS solo.
# Requiere deploy/.env (SCHESTAKOW_DOMAIN, TLS_EMAIL) y deploy/private/produccion.env (PREPARAR-PUBLICACION.cmd).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ./private/produccion.env
    volumes:
      - schestakow_data:/data
    networks:
      - private

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SCHESTAKOW_DOMAIN: ${SCHESTAKOW_DOMAIN:?Set SCHESTAKOW_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private

volumes:
  schestakow_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
